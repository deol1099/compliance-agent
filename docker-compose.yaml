services:
    nginx:
        build: ./nginx
        ports:
            - "80:80"
        restart: always
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - frontend
        networks:
            - subnet1

    frontend:
        build:
            context: ./frontend/
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        restart: always
        environment:
            - BACKEND_URL="http://nginx:80/api/"
        volumes:
            - /app/node_modules
        networks:
            - subnet1

    backend:
        build:
            context: ./backend/
            dockerfile: Dockerfile
        ports:
            - "5001:5000" ## can use postman to query at this port
        restart: always
        networks:
            - subnet1

networks:
    subnet1:
        ipam:
            driver: default
            config:
                - subnet: "192.168.92.0/24"
