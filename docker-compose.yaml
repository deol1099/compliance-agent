services:
    nginx:
        build: ./nginx
        ports:
            - "3000:80"
        restart: always
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - frontend
        networks:
            - subnet1

    frontend:
        build:
            context: ./compliance-app/
            dockerfile: Dockerfile
        ports:
            - "3001:3000"
        restart: always
        environment:
            BACKEND: "http://backend:3000/"
        volumes:
            - /app/node_modules
        networks:
            - subnet1

networks:
    subnet1:
        ipam:
            driver: default
            config:
                - subnet: "192.168.92.0/24"
